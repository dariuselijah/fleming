name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NEXT_PUBLIC_VERCEL_URL: https://example.invalid
  NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
  SUPABASE_SERVICE_ROLE_KEY: ci-server-placeholder
  OPENAI_API_KEY: ci-provider-placeholder
  CSRF_SECRET: ci-csrf-placeholder-00000000000000000000000000000000
  ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
  CRON_SECRET: ci-cron-placeholder-00000000000000000000000000000000
  MEDIKREDIT_DRY_RUN: "0"
  MEDIKREDIT_ENABLE_XML_PREVIEW: "0"
  MEDIKREDIT_STORE_RAW_XML: "0"
  MEDPRAX_CLAIM_PREFLIGHT_MODE: required
  MEDPRAX_ALLOW_UNVERIFIED_CLAIMS: "0"
  POLAR_SH_DRY_RUN: "0"
  STITCH_DRY_RUN: "0"

jobs:
  validate:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run type-check

      - name: Run critical regression tests
        run: npm run test:ci

      - name: Validate production configuration contract
        run: npm run check-env:production
        env:
          NODE_ENV: production

  build:
    name: Build Application
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.build-cache.outputs.key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate build cache key
        id: build-cache
        run: echo "key=build-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', 'package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Check build cache
        id: check-build-cache
        uses: actions/cache@v4
        with:
          path: .next
          key: ${{ steps.build-cache.outputs.key }}

      - name: Build application
        if: steps.check-build-cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Cache build output
        if: steps.check-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .next
          key: ${{ steps.build-cache.outputs.key }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .next/standalone
            .next/static
            public
            package.json
            next.config.ts

  browser:
    name: Public Browser and Accessibility Smoke
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public browser and accessibility checks
        run: npm run test:browser
        env:
          E2E_DISABLE_EXTERNAL_SERVICES: "1"

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-artifacts
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: ignore

  docker:
    name: Build and Push Docker Image
    needs: [validate, build, browser]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_VERCEL_URL=${{ env.NEXT_PUBLIC_VERCEL_URL }}

